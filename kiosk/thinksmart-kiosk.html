<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Voice</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      touch-action: manipulation;
      user-select: none;
    }
    #face-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #1a1a1a;
    }
    #face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #clock {
      position: absolute;
      left: 0;
      right: 0;
      top: 28px;
      text-align: center;
      color: #eceae6;
      pointer-events: none;
      text-shadow: 0 1px 8px rgba(0,0,0,0.55);
    }
    #clock-time {
      font-size: 52px;
      font-weight: 500;
      letter-spacing: 1px;
      line-height: 1.05;
    }
    #clock-date {
      margin-top: 6px;
      font-size: 20px;
      letter-spacing: 0.6px;
      color: rgba(236,234,230,0.78);
    }
    #hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 36px;
      text-align: center;
      color: rgba(255,255,255,0.75);
      font-size: 22px;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #blank {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 30;
      display: none;
    }
    #blank.on {
      display: block;
    }
    #gear {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 40;
      width: 52px;
      height: 52px;
      padding: 12px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      color: #eceae6;
      cursor: pointer;
    }
    #gear svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    #gear:active {
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="face-stage" class="idle">
    <img id="face" alt="" src="/faces/idle.jpg" />
  </div>
  <div id="clock">
    <div id="clock-time"></div>
    <div id="clock-date"></div>
  </div>
  <div id="hint">say hey grok, or press to talk</div>
  <button id="gear" type="button" aria-label="Exit kiosk to terminal" title="Exit kiosk to terminal">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.62l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.86a.49.49 0 0 0 .12.62l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.62l1.92 3.32c.12.22.38.31.59.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.21.09.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.62l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>
  </button>
  <div id="blank"></div>
  <audio id="player" playsinline webkit-playsinline></audio>
  <script src="/thinksmart-kiosk.js?v=44"></script>
</body>
</html>
